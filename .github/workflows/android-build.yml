name: Android Build

on:
  push:
    branches: [ "master", "main", "ACLI" ]
    tags:
      - '*'
  pull_request:
    branches: [ "master", "main", "ACLI" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Send APK to Telegram
      if: github.ref == 'refs/heads/ACLI'
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
          echo "⚠️ BOT_TOKEN or CHAT_ID not set. Skipping Telegram upload."
          echo "Add these secrets in GitHub repo settings to enable Telegram delivery."
          exit 0
        fi
        
        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
        COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
        COMMIT_SHA=$(git rev-parse --short HEAD)
        BRANCH=${GITHUB_REF##*/}
        
        echo "📤 Sending APK to Telegram..."
        
        RESPONSE=$(curl -s -F "chat_id=$CHAT_ID" \
             -F "document=@$APK_PATH" \
             -F "caption=🚀 Kotatsu Personal - Branch: $BRANCH - Commit: $COMMIT_SHA - Size: $APK_SIZE" \
             "https://api.telegram.org/bot$BOT_TOKEN/sendDocument")
        
        if echo "$RESPONSE" | grep -q '"ok":true'; then
          echo "✅ APK sent to Telegram successfully!"
        else
          echo "❌ Failed to send APK to Telegram"
          echo "Response: $RESPONSE"
          exit 1
        fi
